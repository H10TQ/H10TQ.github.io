<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H10TQ Tube</title>
  <style>
    :root { color-scheme: dark; --bg:#0f0f0f; --panel:#181818; --line:#2b2b2b; --text:#f5f5f5; --muted:#aaa; --accent:#ff0033; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial, Helvetica, sans-serif; }
    header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; padding:14px 22px; background:rgba(15,15,15,.96); border-bottom:1px solid var(--line); }
    .brand { font-size:22px; font-weight:900; letter-spacing:-1px; white-space:nowrap; color:#f1eeee; text-shadow: 0 0 2px #8b0000, 1px 1px 0 #5b0000, -1px 2px 0 #5b0000; }
    .brand span {
      position:relative;
      display:inline-block;
      color:#d00024;
      background:linear-gradient(#ff5268 0%, #d00024 48%, #760014 100%);
      background-clip:text;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 2px 1px #42000a);
      text-shadow:none;
    }
    /* CSS-only blood drips hanging from the logo letters */
    .brand span::after {
      content:"";
      position:absolute;
      left:5%; right:3%; top:78%;
      height:13px;
      pointer-events:none;
      background:
        radial-gradient(ellipse 3px 7px at 12% 0%, #b80020 96%, transparent 100%),
        radial-gradient(ellipse 2.5px 10px at 35% 0%, #a9001c 96%, transparent 100%),
        radial-gradient(ellipse 3px 6px at 63% 0%, #c40024 96%, transparent 100%),
        radial-gradient(ellipse 2px 8px at 86% 0%, #8e0017 96%, transparent 100%);
      background-repeat:no-repeat;
    }
    .search { flex:1; display:flex; max-width:680px; margin:auto; }
    .search input { width:100%; min-width:0; padding:11px 14px; border:1px solid #3a3a3a; border-radius:22px 0 0 22px; color:var(--text); background:#121212; outline:none; }
    .search button { padding:0 18px; border:1px solid #3a3a3a; border-left:0; border-radius:0 22px 22px 0; background:#282828; color:white; cursor:pointer; }
    .upload { border:0; border-radius:22px; background:var(--accent); color:white; font-weight:bold; padding:11px 16px; cursor:pointer; white-space:nowrap; }
    main { max-width:1450px; margin:auto; padding:24px; }
    .intro { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; }
    h1 { font-size:25px; margin:0 0 7px; }
    .hint { color:var(--muted); font-size:14px; line-height:1.5; margin:0; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
    .chip { background:#272727; color:#eee; border:0; padding:9px 14px; border-radius:8px; cursor:pointer; }
    .chip.active { background:#f1f1f1; color:#111; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(245px,1fr)); gap:26px 18px; }
    .card { min-width:0; cursor:pointer; }
    .thumb { position:relative; width:100%; aspect-ratio:16/9; background:#222; border-radius:12px; overflow:hidden; }
    .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
    .duration { position:absolute; right:7px; bottom:7px; background:rgba(0,0,0,.8); color:white; font-size:12px; padding:3px 5px; border-radius:4px; pointer-events:none; }
    .meta { display:flex; gap:11px; padding-top:12px; }
    .avatar { flex:0 0 38px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:#333; font-weight:bold; color:#fff; }
    .title { font-weight:700; line-height:1.35; margin:0 0 7px; overflow-wrap:anywhere; }
    .details { font-size:13px; line-height:1.5; color:var(--muted); }
    .empty { grid-column:1/-1; padding:55px 20px; text-align:center; color:var(--muted); border:1px dashed #444; border-radius:14px; }
    .empty strong { color:white; display:block; font-size:19px; margin-bottom:8px; }
    dialog { width:min(1000px,94vw); border:1px solid #444; border-radius:14px; padding:0; background:#181818; color:white; }
    dialog::backdrop { background:rgba(0,0,0,.82); }
    .player-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; gap:12px; }
    .player-head h2 { font-size:18px; margin:0; }
    .close { border:0; background:#333; color:white; border-radius:8px; padding:8px 12px; cursor:pointer; }
    .player-wrap { background:black; }
    .player-wrap video { display:block; width:100%; max-height:70vh; }
    .player-info { padding:15px 18px 20px; color:#bbb; font-size:14px; }
    .player-info strong { color:white; }
    @media(max-width:620px) {
      header { flex-wrap:wrap; padding:12px; gap:10px; }
      .brand { font-size:20px; }
      .search { order:3; flex-basis:100%; max-width:none; }
      .upload { margin-left:auto; padding:10px 12px; }
      main { padding:17px 12px; }
      .intro { align-items:flex-start; flex-direction:column; }
      .grid { grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:20px 12px; }
      .meta { gap:8px; padding-top:9px; }
      .avatar { width:31px; height:31px; flex-basis:31px; font-size:12px; }
      .title { font-size:14px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span>H10TQ</span> Tube</div>
    <form class="search" id="searchForm">
      <input id="searchInput" type="search" placeholder="Search" aria-label="Search videos" />
      <button type="submit" aria-label="Search">⌕</button>
    </form>
  </header>

  <main>
    <nav class="filters" aria-label="Video filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="recent">Recently added</button>
    </nav>
    <section class="grid" id="videoGrid" aria-live="polite"></section>
  </main>

  <dialog id="playerDialog">
    <div class="player-head">
      <h2 id="playerTitle">Video</h2>
      <button class="close" id="closePlayer">✕ Close</button>
    </div>
    <div class="player-wrap"><video id="mainPlayer" controls playsinline></video></div>
    <div class="player-info" id="playerInfo"></div>
  </dialog>

  <script>
    const grid = document.getElementById('videoGrid');
    const searchInput = document.getElementById('searchInput');
    const dialog = document.getElementById('playerDialog');
    const mainPlayer = document.getElementById('mainPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const playerInfo = document.getElementById('playerInfo');

    let videos = [];
    let activeFilter = 'all';
    let currentObjectUrl = null;

    document.getElementById('searchForm').addEventListener('submit', (event) => event.preventDefault());
    searchInput.addEventListener('input', render);

    document.querySelectorAll('[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(chip => chip.classList.toggle('active', chip === button));
        render();
      });
    });

    function formatBytes(bytes) {
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const shown = videos.filter(video => {
        const matchesQuery = video.title.toLowerCase().includes(query);
        return matchesQuery && (activeFilter === 'all' || activeFilter === 'recent');
      });

      grid.innerHTML = '';
      if (!shown.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = videos.length
          ? '<strong>No videos found</strong>Try another search.'
          : '<strong>No videos yet</strong>Your videos will appear here.';
        grid.appendChild(empty);
        return;
      }

      shown.forEach(video => {
        const card = document.createElement('article');
        card.className = 'card';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Watch ${video.title}`);

        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        const preview = document.createElement('video');
        preview.src = URL.createObjectURL(video.file);
        preview.muted = true;
        preview.preload = 'metadata';
        preview.playsInline = true;
        preview.addEventListener('loadedmetadata', () => {
          try { preview.currentTime = Math.min(1, preview.duration / 2 || 0); } catch {}
        }, { once: true });
        thumb.appendChild(preview);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '▶';
        const text = document.createElement('div');
        text.style.minWidth = '0';
        const title = document.createElement('p');
        title.className = 'title';
        title.textContent = video.title;
        const details = document.createElement('div');
        details.className = 'details';
        details.textContent = `My video library · ${formatBytes(video.file.size)}`;
        text.append(title, details);
        meta.append(avatar, text);
        card.append(thumb, meta);

        const openPlayer = () => playVideo(video);
        card.addEventListener('click', openPlayer);
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayer(); }
        });
        grid.appendChild(card);
      });
    }

    function playVideo(video) {
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(video.file);
      mainPlayer.src = currentObjectUrl;
      playerTitle.textContent = video.title;
      playerInfo.innerHTML = `<strong>${escapeHtml(video.title)}</strong> · ${formatBytes(video.file.size)}`;
      dialog.showModal();
      mainPlayer.play().catch(() => {});
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      })[char]);
    }

    document.getElementById('closePlayer').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      mainPlayer.pause();
      mainPlayer.removeAttribute('src');
      mainPlayer.load();
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    });

    render();
  </script>
</body>
</html>
